[tool.poetry]
name = "research-agent-platform"
version = "0.1.0"
description = "高等教育科研效率提升Agent平台"
authors = ["Research Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.23"
alembic = "^1.13.0"
asyncpg = "^0.29.0"
redis = "^5.0.1"
openai = "^1.6.0"
pymilvus = "^2.3.6"
python-jose = "^3.3.0"
passlib = "^1.7.4"
python-multipart = "^0.0.6"
httpx = "^0.25.2"
pandas = "^2.1.4"
numpy = "^1.26.2"

[tool.poetry.group.dev.dependencies]
# 版本对齐 2026-09-07：与 .venv 实测安装版本一致（原声明为 ^7.4.3 / ^0.23.2 /
# ^4.1.0 / ^23.12.0 / ^0.1.8 / ^1.7.1，全部低于实际所用大版本，导致
# `poetry install` 出来的工具链与本地不一致、检查结果不可复现）。
# CI 使用同一批版本，避免静态检查结论随工具版本漂移。
pytest = "^9.1.0"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
black = "^26.5.1"
ruff = "^0.15.18"
mypy = "^2.1.0"
# 数值黄金测试基准：tests/unit/test_numerical_golden.py 用它交叉校验
# 手写的统计/功效实现。仅测试用，不进生产依赖（生产保持零第三方依赖手写）。
scipy = ">=1.11"
# tests/unit/test_latex_l7_omml_semantics.py 依赖 docx 解析 OMML
python-docx = ">=1.1"

[tool.black]
line-length = 88
target-version = ['py314']

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT"]

[tool.ruff.lint.per-file-ignores]
# prompts 内容文件：长行为 LLM 提示词文本本身，拆分物理行会改变内容
"app/agents/*/prompts.py" = ["E501"]
# 独立 CLI 工具脚本：长行为 HTML/XML 模板与输出格式内容，非代码质量问题
"app/agents/*/scripts/*.py" = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
# 类型收敛策略（体检报告 P2-13）：批次一+二清偿后存量 58 错（2026-10-26 实测，基线 890 → 58），
# 新文件必须零新增——
# 提交前跑 mypy 只看自己改动文件的错误数不上升。
# agents/*/scripts/ 是独立 CLI 模板（自带 sys.path 引导与文本模板），不参与类型检查
exclude = 'app/agents/[^/]+/scripts/'

# 可选运行时依赖（NPU / 文档格式 / 图表）：缺失时业务代码有 try/except 降级，
# 类型层面按 Any 处理
[[tool.mypy.overrides]]
module = [
  "torch.*",
  "torch_npu.*",
  "sentence_transformers.*",
  "matplotlib.*",
  "PIL.*",
  "fitz.*",
  "pptx.*",
  "pypdf.*",
  "latex2mathml.*",
  "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests",
    "performance: performance tests",
    "e2e: end-to-end tests"
]
