name: nature-citation
version: 2.0.0
description: Declarative manifest for the static/dynamic split of nature-citation.
always_load:
- static/core/principles.md
- static/core/chinese-mode.md
- static/core/workflow.md
references:
  on_demand:
  - condition: script flags and long-article batch strategy
    path: references/script-usage.md
  - condition: claim-to-search-query strategy
    path: references/search-strategy.md
  - condition: Nature/CNS journal-family boundary
    path: references/journal-scope.md
  - condition: RIS/EndNote/Zotero RDF export
    path: references/ris-endnote.md
