name: nature-writing
version: 2.0.0

always_load:
  - ../_shared/core/terminology-ledger.md
  - static/core/stance.md
  - static/core/workflow.md
  - static/core/output-format.md

axes:
  paper_type:
    values:
      - research
      - methods
      - hypothesis
      - algorithmic
      - review
    default: research
  section:
    values:
      - abstract
      - intro
      - related-work
      - method
      - experiments
      - discussion
      - conclusion
      - title
    multi: true
  language:
    values:
      - en
      - zh-to-en
    default: en
  journal:
    values:
      - nature
      - nat-comms
      - generic
    default: generic
